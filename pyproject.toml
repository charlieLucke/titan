[project]
name = "titan"
version = "0.1.0"
description = "Local high-performance RAG system on a single workstation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.93.0",
    "fastapi>=0.136.1",
    "flagembedding>=1.4.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.1.0",
    "qdrant-client>=1.18.0",
    "requests>=2.34.0",
    "torch>=2.11.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titan"]

# ---------- Ruff (linter + formatter, replaces black/flake8/isort) ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear (common bugs)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (modernize syntax)
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "RUF001",  # ambiguous unicode in strings — intentional German en-dash typography
    "RUF002",  # ambiguous unicode in docstrings — intentional
    "RUF003",  # ambiguous unicode in comments — intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # allow `assert` in tests
"src/titan/evaluate.py" = ["E501"]  # long German judge prompts in string constants

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- Mypy (type checker, strict mode) ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
ignore_errors = true

# ML libraries without type stubs — see DECISIONS.md 2026-05-12
[[tool.mypy.overrides]]
module = [
    "FlagEmbedding.*",
    "flagembedding.*",
    "docling.*",
    "docling_core.*",
]
ignore_missing_imports = true

# FastAPI decorators are not fully typed for mypy strict mode
[[tool.mypy.overrides]]
module = "titan.service.routes"
disable_error_code = ["untyped-decorator", "no-any-return"]

# python-frontmatter has no type stubs
[[tool.mypy.overrides]]
module = "frontmatter"
ignore_missing_imports = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring external services",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
