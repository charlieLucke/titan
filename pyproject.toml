[project]
name = "titan"
version = "0.1.0"
description = "Local high-performance RAG system on a single workstation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.93.0",
    "fastapi>=0.136.1",
    "flagembedding>=1.4.0",
    "httpx>=0.28.1",
    "packaging>=24.0",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.1.0",
    "qdrant-client>=1.18.0",
    "requests>=2.34.0",
    "torch>=2.11.0",
    "uvicorn[standard]>=0.46.0",
    # Imported directly in src/, so declared directly. Leaning on fastapi or
    # fastmcp to keep pulling these in is a transitive dependency the audit
    # flags (DEP003): the day either drops one, this breaks at import time.
    "pydantic>=2.0",
    "transformers>=4.40",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titan"]

# ---------- Ruff (linter + formatter, replaces black/flake8/isort) ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear (common bugs)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (modernize syntax)
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules

    # --- AI-code audit gate -------------------------------------------------
    # Added 2026-09-13 after auditing every repo against the "bad AI code"
    # catalogue. These four are the rules that catalogue turns into findings:
    # a broad catch that hides a failure, an assert standing in for validation,
    # a request without a timeout, an f-string inside a log call, and an import
    # buried in a function body. Each one is allowed where it is justified —
    # but then it carries a `noqa` that says why, instead of passing silently.
    "BLE",     # blind `except Exception`
    "S",       # flake8-bandit: assert-as-validation, missing timeout, shell=True
    "G",       # logging: no f-strings in log calls
    "PLC0415", # import inside a function — deferred imports must justify themselves
]
ignore = [
    "RUF001",  # ambiguous unicode in strings — intentional German en-dash typography
    "RUF002",  # ambiguous unicode in docstrings — intentional
    "RUF003",  # ambiguous unicode in comments — intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is the point of a test
    "S105",    # fake tokens in fixtures are not secrets
    "S106",
    "PLC0415", # a test may import inside the test that needs it
    "S108",    # "/tmp/..." in a test is a path literal, not a temp file
    "S104",    # a test may assert that "0.0.0.0" is accepted
]
"src/titan/evaluate.py" = ["E501"]  # long German judge prompts in string constants

# --- AI-code audit gate: justified exceptions ------------------------------
# Every entry below states why the rule does not apply here. A file that is not
# listed still has to pass, so a new blind catch or a new deferred import fails
# the gate instead of blending in.
# Deferred imports of the model stack are deliberate. torch, FlagEmbedding and
# transformers cost seconds and VRAM at import time; loading them when the CLI
# only prints --help, or in a worker that never searches, is the bug we avoid.
"src/titan/ingest.py" = ["PLC0415"]
"src/titan/infra.py" = ["PLC0415"]
"src/titan/search.py" = ["BLE001", "PLC0415"]  # optional query cache (logged, falls through live) + deferred qdrant models
"src/titan/service/routes.py" = ["PLC0415"]
"src/titan/service/repository.py" = ["PLC0415"]
"src/titan/eval/ab_eval.py" = ["PLC0415"]
"src/titan/service/_vram_probe.py" = ["BLE001", "PLC0415"]  # probes torch/FlagEmbedding on demand; importing them to answer /health would defeat the probe
"src/titan/main.py" = ["PLC0415"]      # the dispatcher imports `serve` only for the `service` subcommand, so `python -m titan` stays instant
"src/titan/service/app.py" = ["PLC0415"]  # `from titan.search import ...` inside the task breaks a circular import at module load
"src/titan/utils.py" = ["PLC0415"]     # fcntl is Unix-only and imported where the lock is taken

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- Mypy (type checker, strict mode) ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
ignore_errors = true

# ML libraries without type stubs — see DECISIONS.md 2026-05-12
[[tool.mypy.overrides]]
module = [
    "FlagEmbedding.*",
    "flagembedding.*",
    "docling.*",
    "docling_core.*",
]
ignore_missing_imports = true

# FastAPI decorators are not fully typed for mypy strict mode
[[tool.mypy.overrides]]
module = "titan.service.routes"
disable_error_code = ["untyped-decorator", "no-any-return"]

# python-frontmatter has no type stubs
[[tool.mypy.overrides]]
module = "frontmatter"
ignore_missing_imports = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring external services",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# ---------- deptry (dependency audit) ----------
# Catches the three dependency defects the AI-code audit looks for: a package
# imported but never declared, a package declared but never imported, and a
# hallucinated name that resolves to nothing. The map below exists because the
# import name and the package name differ — without it deptry reports both
# halves of the same pair and the check stops meaning anything.
[tool.deptry]
known_first_party = ["titan"]
exclude = [".venv", "tests", "evals", "tools"]

[tool.deptry.package_module_name_map]
python-docx = ["docx"]
beautifulsoup4 = ["bs4"]
pyyaml = ["yaml"]
python-dotenv = ["dotenv"]
python-frontmatter = ["frontmatter"]
flagembedding = ["FlagEmbedding"]
qdrant-client = ["qdrant_client"]
