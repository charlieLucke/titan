name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on new commits to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the whole history below, not just this push.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Secret scan (gitleaks, full history)
        # The binary rather than gitleaks-action: the action scans the range
        # base^..head, which needs commits a shallow checkout does not have, and
        # it fails outright whenever a push carries more than one commit. This
        # scans what the step name says it scans.
        run: |
          curl -sSL --retry 3 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . -c .gitleaks.toml --redact --no-banner
          rm -f gitleaks gitleaks.tar.gz

      - name: Dependency audit (deptry)
        run: uvx deptry@0.23.0 .

      - name: Duplication (jscpd, fails above 3%)
        run: npx --yes jscpd@4.0.5 src --config .jscpd.json

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src tests

      - name: Test (pytest)
        run: uv run pytest -m "not integration"
