# Run on every commit. Install with: uv run pre-commit install
# Update versions periodically with: uv run pre-commit autoupdate

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Ruff: lint + format (replaces black, flake8, isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Mypy: type checking (strict)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.0.0
    hooks:
      - id: mypy
        files: ^(src|tests)/
        additional_dependencies:
          - pydantic>=2.0
          - pydantic-settings>=2.5
          - fastapi>=0.100
          - torch>=2.0
          - httpx>=0.24
          - types-pyyaml>=6.0

  # gitleaks: no secret reaches a commit. The repos here are meant to go public,
  # and a secret in history is not removed by deleting it from the tip.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
